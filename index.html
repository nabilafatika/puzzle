<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Puzzle Ceria - Anak TK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="winSound" src="applause.mp3"></audio>

    <h1>🧩 Puzzle Ceria TK PGRI 18 SEMARANG 🌟</h1>

    <div class="controls">
        <label>Pilih Gambar:</label>
        <select id="imageSelect">
            <option value="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400">🐶 Anjing Lucu</option>
            <option value="https://images.unsplash.com/photo-1574158622682-e40e69881006?w=400">🐱 Kucing Imut</option>
            <option value="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400">🍎 Apel Segar</option>
        </select>
        
        <label>Upload Foto:</label>
        <input type="file" id="uploadImage" accept="image/*">

        <!-- PILIHAN BENTUK PUZZLE -->
        <label>Bentuk:</label>
       <!-- Ganti dropdown shapeSelect dengan dua tombol ini -->
        <div class="shape-buttons">
            <button type="button" id="btnSquare" class="shape-btn active">Kotak Biasa</button>
            <button type="button" id="btnJigsaw" class="shape-btn">Jigsaw (Berliuk)</button>
        </div>

        <label>Level:</label>
        <select id="gridSize">
            <option value="2" selected>Mudah (2x2) 🐰</option>
            <option value="3">Sedang (3x3) 🐼</option>
            <option value="4">Sulit (4x4) 🦁</option>
        </select>
        <button id="restartBtn">🔄 Acak Ulang</button>
    </div>

    <div class="game-container">
        <div>
            <h3 style="text-align:center; margin-top:0;">Tempat Menyusun</h3>
            <div id="board" class="board"></div>
        </div>
        <div>
            <h3 style="text-align:center; margin-top:0;">Kepingan Puzzle</h3>
            <div id="piecesArea" class="pieces-area"></div>
        </div>
    </div>

    <div id="winPopup" class="win-message">
        🎉 YAY! KAMU BERHASIL! 🎉
        <p style="margin: 10px 0 0 0; font-size: 1.2rem;">keren bangett!!!🌟⭐✨🌟⭐</p> 
        <span onclick="resetGame()">Main Lagi YUK !</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
